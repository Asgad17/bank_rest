services:
  postgres:
    image: postgres:16-alpine
    container_name: bankcards-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bankcards
      POSTGRES_USER: bankcards
      POSTGRES_PASSWORD: bankcards
    ports:
      - "5433:5432"
    volumes:
      - bankcards-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankcards -d bankcards"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bankcards-pg-data:
